<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Product Catalog</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        /* Ensure full height layout */
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        /* Navbar */
        .navbar {
            display: flex;
            justify-content: space-between;
            padding: 10px;
            background-color: #333;
        }
        .navbar a {
            color: white;
            padding: 10px;
            text-decoration: none;
        }

        /* Content area */
        .content {
            flex: 1;
            padding: 20px;
            padding-bottom: 60px; /* Space for footer */
        }

        /* Product Container */
        .product-container {
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 10px;
            margin: 10px;
            width: 200px;
            text-align: center;
            display: inline-block;
            background-color: #f9f9f9;
        }
        .product-name {
            font-weight: bold;
            margin-bottom: 5px;
        }
        .product-image img {
            width: 150px;
            height: auto;
            margin-bottom: 5px;
        }
        .product-description {
            margin-bottom: 5px;
        }
        .product-price {
            color: green;
            font-weight: bold;
        }

        /* Footer */
        .footer {
            background-color: #f1f1f1;
            padding: 10px;
            display: flex;
            justify-content: space-between;
            width: 100%;
            /*position: fixed;*/
            bottom: 0;
            left: 0;
        }
        .footer div {
            width: 45%;
            text-align: left;
        }
        .social-buttons a {
            display: inline-block;
            padding: 8px;
            text-decoration: none;
            margin-right: 5px;
            color: white;
            border-radius: 5px;
        }
        .instagram { background-color: #E4405F; }
        .mail { background-color: #007BFF; }
    </style>
</head>
<body>

<!-- Navbar -->
<div class="navbar">
    <a href="/">Home</a>
    <a href="/catalog">Products</a>
</div>

<!-- Main Content -->
<div class="content">
    <h2>Product Catalog</h2>
    <div th:each="product : ${products}" class="product-container">
        <div class="product-name" th:text="${product.name}"></div>
        <div class="product-image">
            <img th:src="@{/images/{imageName}(imageName=${product.imageUrl})}" alt="Product Image">
        </div>
        <div class="product-description" th:text="${product.description}"></div>
        <div class="product-price" th:text="'₹ ' + ${product.price}"></div>
    </div>
</div>

<!-- Footer -->
<div class="footer">
    <div>
        <h3>About Us</h3>
        <p>We provide the best quality herbal powders.</p>
    </div>
    <div>
        <h3>Follow Us</h3>
        <div class="social-buttons">
            <a href="https://instagram.com" class="instagram">Instagram</a>
            <a href="mailto:info@example.com" class="mail">Email</a>
        </div>
        <p>Contact: +91 98765 43210</p>
    </div>
</div>

</body>
</html>
