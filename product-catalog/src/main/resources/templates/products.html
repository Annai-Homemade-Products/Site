<!-- Products Page (products.html) -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Products - Homemade Products</title>
  <!-- <link rel="stylesheet" href="styles.css" /> -->
  <link rel="stylesheet" th:href="@{/styles.css}" />
  
</head>
<body>
  <!-- Section 1: Header -->
  <header class="header">
    <div class="navbar-left">
      <form action="/products/search" method="get">
        <input type="text" name="keyword" placeholder="Search..." class="search-bar" />
      </form>
    </div>
    <nav class="navbar-right">
      <a href="/">Home</a>
      <a href="/products">All</a>
      <a href="/products/category?type=Powders">Powders</a>
      <a href="/products/category?type=Hair Oils">Hair Oils</a>
      <a href="/products/category?type=Masalas">Masalas</a>
    </nav>
  </header>

  <!-- Section 2: Products -->
  <section class="product-section">
    <h2 th:text="${category != null} ? ${category} : 'Our Products'">Our Products</h2>
    <div class="product-grid">
      <div class="product-item" th:each="product : ${products}">
        <img th:src="@{'/images/' + ${product.imageUrl}}" th:alt="${product.name}" />
        <p th:text="${product.name}"></p>
      </div>
    </div>
  </section>

  <!-- Section 3: Footer -->
  <footer class="footer">
    <div>
      <h3>Get to Know Us</h3>
      <a href="#">Shop</a>
      <a href="#">Extras</a>
      <a href="#">About</a>
      <a href="#">Contact</a>
    </div>
    <div>
      <h3>Follow Us</h3>
      <a href="https://facebook.com" target="_blank">Facebook</a>
      <a href="https://instagram.com" target="_blank">Instagram</a>
    </div>
  </footer>
</body>
</html>
